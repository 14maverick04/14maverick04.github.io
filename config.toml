baseURL = 'https://www.jerinthomas.in'
languageCode = 'en-us'
theme = 'anatole'
enableEmoji = true
enableRobotsTXT = true

# Don't let Hugo publish Quarto source files; Quarto still reads them.
ignoreFiles = ['\.qmd$']

# Quarto emits raw HTML (callouts, figures, math wrappers). Hugo's Goldmark
# renderer strips raw HTML by default, so allow it through.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
author = 'Jerin Thomas'
contentratio = '0.80'
copyright = 'Jerin Thomas, 2020-{{ YEAR }}'
description = '"Tryst with Curiosity"'
doNotLoadAnimations = false
favicon = '/favicon/'
profilePicture = 'images/profile.jpg'
mainSections = [""]
customCss = ["css/styles.css"]
indexDateFormat = "2006-01-02"
singleDateFormat = "2006-01-02"
title = 'Jerin Thomas'

# Load KaTeX (via the theme's math.html partial) so Quarto's $$...$$ renders.
[params.math]
enable = true
use = "katex"


[[params.socialIcons]]
icon = "fab fa-linkedin"
title = "LinkedIn"
url = "https://linkedin.com/in/jerinthomas1404"

[[params.socialIcons]]
icon = "fab fa-github"
title = "Github"
url = "https://github.com/jerinthomas1404"

[[params.socialIcons]]
icon = "fas fa-envelope"
title = "e-mail"
url = "mailto:jerinthomas1498@gmail.com"


